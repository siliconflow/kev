name: docker-build

# Build & push the kev serving image to the SF dedicated registry.
# Same convention as the vLLM/SGLang agent repos (FaaS Push Skill §7.5):
#   - trigger: push to main (github.sha on main = merge commit)
#   - image tag = 7-char short SHA of that commit; no latest/main tags (§7.1)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: hub.6scloud.com
  NAMESPACE: d1r7umcsfi9c73b4drdg
  IMAGE_NAME: kev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # SF GPU Functions run nvidia instances only -> linux/amd64 (FaaS Push
      # Skill §7.3). If arm64 (Ascend) variants ever appear, add platforms here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image tag
        run: |
          echo "image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short }}"
